name: Build Craftium APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: craftium-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        shell: bash
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.3.13750724"

      - name: Build APK
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app_pojavlauncher:assembleDebug

      - name: Verify APK output
        shell: bash
        run: |
          APK_DIR="app_pojavlauncher/build/outputs/apk/debug"
          APK="$(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [[ -z "$APK" || ! -s "$APK" ]]; then
            echo "Debug APK was not produced in $APK_DIR" >&2
            find app_pojavlauncher/build/outputs -maxdepth 5 -type f -print || true
            exit 1
          fi
          echo "APK=$APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Craftium-debug-apk
          path: app_pojavlauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
